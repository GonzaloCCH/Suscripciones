<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cuentas ChatGPT</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:#e0e0e5;--ac:#10a37f;--g:#d9f4e6;--gt:#0a6b3f;--r:#fde0e0;--rt:#a12020}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111;--card:#1c1c1e;--tx:#f2f2f2;--mu:#9a9aa0;--bd:#333;--g:#12392a;--gt:#6ee7a8;--r:#431a1a;--rt:#fca5a5}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:6px 0}nav button.on{color:var(--ac);font-weight:700}
input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
label{font-size:13px;color:var(--mu)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.btn.s{background:var(--bd);color:var(--tx);width:auto;padding:6px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.mu{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border-radius:10px;padding:8px 2px;text-align:center;font-size:12px;font-weight:600}.m.g{background:var(--g);color:var(--gt)}.m.r{background:var(--r);color:var(--rt)}
.big{font-size:22px;font-weight:700}
.x{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}td:first-child,th:first-child{text-align:left}
</style></head><body>
<h1 id="t">Cuentas ChatGPT</h1><div id="v"></div>
<nav id="n"></nav>
<script>
const K='cuentasChatGPT';
let S={members:['Yo','Hermano 1','Hermano 2','Hermano 3'],accounts:['BANRURAL','ZIGI','Efectivo'],cost:61.29,start:'2026-11',pay:[],out:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='res',sel=0;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(Math.round(n*10000)/10000).toLocaleString('es',{maximumFractionDigits:4});
const f2=n=>(Math.round(n*100)/100).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const share=()=>S.cost/S.members.length;
const paid=i=>S.pay.filter(p=>p.m==i).reduce((a,p)=>a+p.a,0);
const outSh=()=>S.out.reduce((a,o)=>a+o.a,0)/S.members.length;
const saldo=i=>paid(i)-outSh();
const meses=i=>Math.max(0,Math.floor(saldo(i)/share()+1e-9));
const mlab=k=>{const[y,m]=S.start.split('-').map(Number);return new Date(y,m-1+k,1).toLocaleDateString('es',{month:'short',year:'2-digit'})};
const upto=i=>{const c=Math.floor(paid(i)/share()+1e-9);return c?mlab(c-1):'—'};
const grid=i=>{const p=paid(i),s=share();let h='<div class="grid">';const n=Math.max(12,Math.ceil(p/s)+1);for(let k=0;k<n;k++)h+=`<div class="m ${p>=(k+1)*s-1e-9?'g':'r'}">${mlab(k)}</div>`;return h+'</div>'};
const today=()=>new Date().toISOString().slice(0,10);
const opts=(a,s)=>a.map((x,i)=>`<option value="${i}" ${i==s?'selected':''}>${E(x)}</option>`).join('');
const plist=(l)=>l.length?l.map(p=>`<div class="row"><div><b>${E(S.members[p.m]||'?')}</b> · ${f2(p.a)}<div class="mu">${p.d} · ${E(p.t)} · ${E(p.c)}${p.n?' · '+E(p.n):''}</div></div><button class="btn s" onclick="delP('${p.id}')">Borrar</button></div>`).join(''):'<div class="mu">Sin pagos.</div>';
function delP(id){if(confirm('¿Borrar este pago?')){S.pay=S.pay.filter(p=>p.id!=id);save();draw()}}
function delO(id){if(confirm('¿Borrar esta salida?')){S.out=S.out.filter(p=>p.id!=id);save();draw()}}
function addP(){const a=parseFloat(document.getElementById('a').value);if(!(a>0))return alert('Escribe un monto');
S.pay.unshift({id:Date.now()+'',m:+document.getElementById('m').value,d:document.getElementById('d').value,a,t:document.getElementById('t2').value,c:S.accounts[+document.getElementById('c').value]||'',n:document.getElementById('n2').value});save();tab='res';draw()}
function addO(){const a=parseFloat(document.getElementById('oa').value);if(!(a>0))return alert('Escribe un monto');
S.out.unshift({id:Date.now()+'',mo:document.getElementById('om').value,a,c:S.accounts[+document.getElementById('oc').value]||''});save();draw()}
function setCfg(){S.cost=parseFloat(document.getElementById('cost').value)||S.cost;S.start=document.getElementById('st').value||S.start;
S.members=document.getElementById('mem').value.split('\n').map(x=>x.trim()).filter(Boolean);S.accounts=document.getElementById('acc').value.split('\n').map(x=>x.trim()).filter(Boolean);save();draw()}
function imp(){try{S=JSON.parse(document.getElementById('bk').value);save();draw()}catch(e){alert('Datos no válidos')}}
function tabs(){const T=[['res','Resumen'],['add','Pago'],['per','Persona'],['out','Salidas'],['cfg','Ajustes']];document.getElementById('n').innerHTML=T.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('')}
function draw(){tabs();let h='';
if(tab=='res'){
const tot=S.members.reduce((a,_,i)=>a+paid(i),0);
h+=`<div class="card"><h2>Cuota mensual por persona</h2><div class="big">${f(share())}</div><div class="mu">${f2(S.cost)} ÷ ${S.members.length} personas</div></div>
<div class="card x"><h2>Por persona</h2><table><tr><th>Nombre</th><th>Pagado</th><th>Saldo</th><th>Meses</th><th>Hasta</th></tr>${S.members.map((n,i)=>`<tr><td>${E(n)}</td><td>${f2(paid(i))}</td><td style="color:${saldo(i)<0?'var(--rt)':'inherit'}">${f2(saldo(i))}</td><td>${meses(i)}</td><td>${upto(i)}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Dónde está el dinero</h2>${S.accounts.map(a=>{const v=S.pay.filter(p=>p.c==a).reduce((s,p)=>s+p.a,0)-S.out.filter(o=>o.c==a).reduce((s,o)=>s+o.a,0);return `<div class="row"><span>${E(a)}</span><b>${f2(v)}</b></div>`}).join('')}<div class="row"><span>Total recibido</span><b>${f2(tot)}</b></div></div>
<div class="card"><h2>Todos los pagos</h2>${plist(S.pay)}</div>`}
if(tab=='add'){h+=`<div class="card"><label>Quién pagó</label><select id="m">${opts(S.members,0)}</select>
<label>Fecha</label><input id="d" type="date" value="${today()}">
<label>Monto</label><input id="a" type="number" inputmode="decimal" step="any" placeholder="25, 60…">
<label>Forma de pago</label><select id="t2"><option>Efectivo</option><option>Transferencia</option><option>Depósito</option><option>Otro</option></select>
<label>Dónde lo tengo</label><select id="c">${opts(S.accounts,0)}</select>
<label>Nota (opcional)</label><input id="n2"><button class="btn" onclick="addP()">Guardar pago</button></div>`}
if(tab=='per'){h+=`<div class="card"><label>Selecciona persona</label><select onchange="sel=+this.value;draw()">${opts(S.members,sel)}</select>
<div class="row"><span>Pagado</span><b>${f2(paid(sel))}</b></div><div class="row"><span>Saldo actual</span><b>${f2(saldo(sel))}</b></div>
<div class="row"><span>Meses que le quedan</span><b>${meses(sel)}</b></div><div class="row"><span>Cubierto hasta</span><b>${upto(sel)}</b></div></div>
<div class="card"><h2>Meses (verde pagado · rojo pendiente)</h2>${grid(sel)}</div>
<div class="card"><h2>Pagos de ${E(S.members[sel]||'')}</h2>${plist(S.pay.filter(p=>p.m==sel))}</div>`}
if(tab=='out'){h+=`<div class="card"><h2>Registrar pago de la suscripción</h2><label>Mes</label><input id="om" type="month" value="${today().slice(0,7)}">
<label>Monto pagado a ChatGPT</label><input id="oa" type="number" inputmode="decimal" step="any" value="${S.cost}">
<label>De dónde salió</label><select id="oc">${opts(S.accounts,0)}</select>
<button class="btn" onclick="addO()">Guardar y descontar a todos</button><div class="mu" style="margin-top:8px">Se descuenta la parte de cada uno (monto ÷ ${S.members.length}) de su saldo.</div></div>
<div class="card"><h2>Salidas</h2>${S.out.length?S.out.map(o=>`<div class="row"><div><b>${o.mo}</b> · ${f2(o.a)}<div class="mu">${E(o.c)} · c/u ${f(o.a/S.members.length)}</div></div><button class="btn s" onclick="delO('${o.id}')">Borrar</button></div>`).join(''):'<div class="mu">Sin salidas.</div>'}</div>`}
if(tab=='cfg'){h+=`<div class="card"><label>Costo mensual de la suscripción</label><input id="cost" type="number" step="any" value="${S.cost}">
<label>Primer mes a cobrar</label><input id="st" type="month" value="${S.start}">
<label>Personas (una por línea)</label><textarea id="mem" rows="5">${S.members.map(E).join('\n')}</textarea>
<label>Cuentas (una por línea)</label><textarea id="acc" rows="4">${S.accounts.map(E).join('\n')}</textarea>
<button class="btn" onclick="setCfg()">Guardar ajustes</button><div class="mu" style="margin-top:8px">Cuota = costo ÷ personas, automático. No cambies el orden de los nombres si ya hay pagos.</div></div>
<div class="card"><h2>Respaldo</h2><textarea id="bk" rows="4">${E(JSON.stringify(S))}</textarea><button class="btn" onclick="imp()">Restaurar desde este texto</button><div class="mu" style="margin-top:8px">Copia ese texto y guárdalo en Notas como respaldo.</div></div>`}
document.getElementById('v').innerHTML=h}
draw();
</script></body></html>
