<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#10a37f">
<title>Cuentas ChatGPT</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:#e0e0e5;--ac:#10a37f;--g:#c9f0dc;--r:#fbd5d5;--rt:#a12020}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111;--card:#1c1c1e;--tx:#f2f2f2;--mu:#9a9aa0;--bd:#333;--g:#14532d;--r:#5b1f1f;--rt:#fca5a5}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif;padding:12px 12px 80px}
h1{font-size:17px;margin:4px 0 10px}h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:6px 0}nav button.on{color:var(--ac);font-weight:700}
input,select,textarea{width:100%;padding:10px;margin:3px 0 9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
label,.lb{font-size:12px;color:var(--mu)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.mu{color:var(--mu);font-size:12px}.x{background:none;border:0;color:#d33;font-size:20px;padding:0 6px}.del{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border-radius:8px;padding:7px 2px;text-align:center;font-size:12px;line-height:1.3}.m b{display:block;font-weight:600}.m span{display:block;min-height:15px}
.xs{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}td:first-child,th:first-child{text-align:left}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:8px 14px;border-radius:16px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}#toast.on{opacity:1}
</style></head><body>
<h1>Cuentas ChatGPT</h1><div id="v"></div><nav id="n"></nav><div id="toast"></div>
<script>
const K='cuentasChatGPT';
let S={members:['Yo','Hermano 1','Hermano 2','Hermano 3'],accounts:['BANRURAL','ZIGI','Efectivo'],cost:61.29,start:'2026-11',pay:[],out:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
if(!S.v5){S.pay.forEach(p=>{if(p.mo===S.start)p.mo=''});S.v5=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cur=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
let tab='res',sel=0,ed='';
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>(Math.round(n*100)/100).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const f4=n=>(Math.round(n*10000)/10000).toLocaleString('es',{maximumFractionDigits:4});
const today=()=>new Date().toISOString().slice(0,10);
const msg=t=>{const e=document.getElementById('toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2000)};
const share=()=>S.cost/S.members.length;
const paid=i=>S.pay.filter(p=>p.m==i).reduce((a,p)=>a+p.a,0);
const outSh=()=>S.out.reduce((a,o)=>a+o.a,0)/S.members.length;
const saldo=i=>paid(i)-outSh();
const meses=i=>Math.max(0,Math.floor(saldo(i)/share()+1e-9));
/* meses: la lista empieza en el mes más antiguo que exista (inicio, pagos o salidas) */
const n12=mo=>{const[y,m]=mo.split('-').map(Number);return y*12+m-1};
const base=()=>{let b=n12(S.start);S.out.forEach(o=>{if(o.mo)b=Math.min(b,n12(o.mo))});S.pay.forEach(p=>{if(p.mo)b=Math.min(b,n12(p.mo))});return b};
const kidx=mo=>n12(mo)-base();
const ym=k=>{const n=base()+k;return Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0')};
const mlab=k=>{const n=base()+k;return new Date(Math.floor(n/12),n%12,1).toLocaleDateString('es',{month:'short',year:'2-digit'})};
const mlong=mo=>{const[y,m]=mo.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es',{month:'long',year:'numeric'})};
const req=k=>{const o=S.out.filter(x=>x.mo===ym(k));return o.length?o.reduce((a,x)=>a+x.a,0)/S.members.length:share()};
const cov=i=>{const c=[];S.pay.filter(p=>p.m==i).sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.id>b.id?1:-1)).forEach(p=>{let k=p.mo?kidx(p.mo):0,r=p.a;while(r>1e-9){const need=req(k)-(c[k]||0);if(need<=1e-6){k++;continue}const put=Math.min(r,need);c[k]=(c[k]||0)+put;r-=put;k++}});return c};
const full=(c,k)=>(c[k]||0)>=req(k)-1e-6;
const upto=i=>{const c=cov(i);let l=-1;for(let k=0;k<c.length;k++)if(full(c,k))l=k;return l>=0?mlab(l):'—'};
const cell=(c,k)=>{const v=c[k]||0,p=Math.min(100,v/req(k)*100),fl=p>=99.99;const bg=fl?'var(--g)':p<=0?'var(--r)':`linear-gradient(90deg,var(--g) ${p}%,var(--r) ${p}%)`;return `<div class="m" style="background:${bg}"><b>${mlab(k)}</b><span>${fl?'✓':v>0?f2(v):''}</span></div>`};
const grid=i=>{const c=cov(i),n=Math.max(12,c.length+1);let h='<div class="grid">';for(let k=0;k<n;k++)h+=cell(c,k);return h+'</div>'};
const optI=(l,s)=>l.map((x,i)=>`<option value="${i}" ${i==s?'selected':''}>${E(x)}</option>`).join('');
const optN=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${E(x)}</option>`).join('');
const optM=s=>'<option value="">Automático (siguiente mes)</option>'+Array.from({length:18},(_,k)=>`<option value="${ym(k)}" ${ym(k)==s?'selected':''}>${mlong(ym(k))}</option>`).join('');
const nextOut=()=>{if(!S.out.length)return S.start;const m=S.out.map(o=>o.mo).sort().pop();const n=n12(m)+1;return Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0')};
const METH=['Efectivo','Transferencia','Depósito','Otro'];
const ted=k=>{ed=ed===k?'':k;draw()};
function up(L,id,p,v,t){const x=S[L].find(y=>y.id==id);if(!x)return;if(t=='n'){v=parseFloat(v);if(!(v>0)){draw();return}}else if(t=='i')v=+v;else if(!v&&t!='x'){draw();return}x[p]=v;save();draw()}
function rm(L,id){if(!confirm('¿Eliminar?'))return;S[L]=S[L].filter(y=>y.id!=id);ed='';save();draw()}
const fld=(L,x,p,lb,t,inner)=>{const c=`onchange="up('${L}','${x.id}','${p}',this.value,'${t}')"`;return `<span class="lb">${lb}</span>`+(inner!=null?`<select ${c}>${inner}</select>`:`<input type="${t=='n'?'number" inputmode="decimal" step="any':t=='d'?'date':t=='mo'?'month':'text'}" value="${E(x[p])}" ${c}>`)};
const payForm=x=>fld('pay',x,'m','Persona','i',optI(S.members,x.m))+fld('pay',x,'a','Monto','n')+fld('pay',x,'d','Fecha','d')+fld('pay',x,'mo','Mes que paga','x',optM(x.mo))+fld('pay',x,'t','Forma de pago','x',optN(METH,x.t))+fld('pay',x,'c','Dónde lo tengo','x',optN(S.accounts,x.c))+fld('pay',x,'n','Nota','x');
const prow=p=>`<div style="border-bottom:1px solid var(--bd)"><div class="row" onclick="ted('p${p.id}')" style="border:0;cursor:pointer"><div><b>${E(S.members[p.m]||'?')}</b> · ${f2(p.a)}<div class="mu">${p.d} · ${p.mo?mlong(p.mo):'mes automático'} · ${E(p.t)} · ${E(p.c)}${p.n?' · '+E(p.n):''}</div></div><button class="x" onclick="event.stopPropagation();rm('pay','${p.id}')">×</button></div>${ed=='p'+p.id?payForm(p):''}</div>`;
const plist=l=>l.length?l.map(prow).join(''):'<div class="mu">Sin pagos.</div>';
function addP(){const a=parseFloat(document.getElementById('a').value);if(!(a>0))return msg('Escribe un monto');
S.pay.unshift({id:Date.now()+'',m:+document.getElementById('m').value,d:document.getElementById('d').value||today(),mo:document.getElementById('mo').value,a,t:document.getElementById('t2').value,c:document.getElementById('c').value,n:document.getElementById('n2').value});save();msg('Pago guardado');tab='res';draw()}
function addO(){const a=parseFloat(document.getElementById('oa').value);if(!(a>0))return msg('Escribe un monto');
S.out.unshift({id:Date.now()+'',mo:document.getElementById('om').value||nextOut(),a,c:document.getElementById('oc').value});save();msg('Salida guardada');draw()}
function setCfg(){S.cost=parseFloat(document.getElementById('cost').value)||S.cost;S.start=document.getElementById('st').value||S.start;
S.members=document.getElementById('mem').value.split('\n').map(x=>x.trim()).filter(Boolean);S.accounts=document.getElementById('acc').value.split('\n').map(x=>x.trim()).filter(Boolean);save();msg('Guardado');draw()}
function imp(){try{S=JSON.parse(document.getElementById('bk').value);save();draw()}catch(e){alert('Datos no válidos')}}
async function upd(){try{for(const x of await navigator.serviceWorker.getRegistrations())await x.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function draw(){
document.getElementById('n').innerHTML=[['res','Resumen'],['add','Pago'],['per','Persona'],['out','Salidas'],['cfg','Ajustes']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';ed='';draw();scrollTo(0,0)">${l}</button>`).join('');
const n=S.members.length;let h='';
if(tab=='res'){h+=`<div class="card"><h2>Cuota mensual por persona</h2><b>${f4(share())}</b> <span class="mu">(${f2(S.cost)} ÷ ${n})</span></div>
<div class="card xs"><h2>Por persona</h2><table><tr><th>Nombre</th><th>Pagado</th><th>Saldo</th><th>Meses</th><th>Hasta</th></tr>${S.members.map((m,i)=>`<tr><td>${E(m)}</td><td>${f2(paid(i))}</td><td style="color:${saldo(i)<0?'var(--rt)':'inherit'}">${f2(saldo(i))}</td><td>${meses(i)}</td><td>${upto(i)}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Dónde está el dinero</h2>${S.accounts.map(a=>{const v=S.pay.filter(p=>p.c==a).reduce((s,p)=>s+p.a,0)-S.out.filter(o=>o.c==a).reduce((s,o)=>s+o.a,0);return `<div class="row"><span>${E(a)}</span><b>${f2(v)}</b></div>`}).join('')}</div>
<div class="card"><h2>Todos los pagos · toca uno para editarlo</h2>${plist(S.pay)}</div>`}
if(tab=='add'){h+=`<div class="card"><label>Quién pagó</label><select id="m">${optI(S.members,0)}</select>
<label>Monto</label><input id="a" type="number" inputmode="decimal" step="any" placeholder="25, 60…">
<label>Mes que paga</label><select id="mo">${optM('')}</select>
<label>Fecha</label><input id="d" type="date" value="${today()}">
<label>Forma de pago</label><select id="t2">${optN(METH)}</select>
<label>Dónde lo tengo</label><select id="c">${optN(S.accounts)}</select>
<label>Nota (opcional)</label><input id="n2"><button class="btn" onclick="addP()">Guardar pago</button></div>`}
if(tab=='per'){const i=Math.min(sel,n-1);h+=`<div class="card"><select onchange="sel=+this.value;draw()">${optI(S.members,i)}</select>
<div class="row"><span>Pagado</span><b>${f2(paid(i))}</b></div><div class="row"><span>Saldo actual</span><b>${f2(saldo(i))}</b></div><div class="row"><span>Meses que le quedan</span><b>${meses(i)}</b></div><div class="row"><span>Cubierto hasta</span><b>${upto(i)}</b></div></div>
<div class="card"><h2>Meses · verde pagado, rojo pendiente</h2>${grid(i)}</div>
<div class="card"><h2>Pagos de ${E(S.members[i]||'')}</h2>${plist(S.pay.filter(p=>p.m==i))}</div>`}
if(tab=='out'){h+=`<div class="card"><label>Mes que se pagó</label><input id="om" type="month" value="${nextOut()}">
<label>Monto pagado a ChatGPT</label><input id="oa" type="number" inputmode="decimal" step="any" value="${S.cost}">
<label>De dónde salió</label><select id="oc">${optN(S.accounts)}</select>
<button class="btn" onclick="addO()">Guardar y descontar a todos</button><div class="mu" style="margin-top:8px">Se descuenta monto ÷ ${n} del saldo de cada uno.</div></div>
<div class="card"><h2>Salidas · toca para editar</h2>${S.out.length?S.out.map(o=>`<div style="border-bottom:1px solid var(--bd)"><div class="row" onclick="ted('o${o.id}')" style="border:0;cursor:pointer"><div><b>${mlong(o.mo)}</b> · ${f2(o.a)}<div class="mu">${E(o.c)} · c/u ${f4(o.a/n)}</div></div><button class="x" onclick="event.stopPropagation();rm('out','${o.id}')">×</button></div>${ed=='o'+o.id?fld('out',o,'mo','Mes','mo')+fld('out',o,'a','Monto','n')+fld('out',o,'c','Cuenta','x',optN(S.accounts,o.c)):''}</div>`).join(''):'<div class="mu">Sin salidas.</div>'}</div>`}
if(tab=='cfg'){h+=`<div class="card"><label>Costo mensual de la suscripción</label><input id="cost" type="number" step="any" value="${S.cost}">
<label>Primer mes a cobrar</label><input id="st" type="month" value="${S.start}">
<label>Personas (una por línea)</label><textarea id="mem" rows="5">${S.members.map(E).join('\n')}</textarea>
<label>Cuentas (una por línea)</label><textarea id="acc" rows="4">${S.accounts.map(E).join('\n')}</textarea>
<button class="btn" onclick="setCfg()">Guardar ajustes</button><div class="mu" style="margin-top:8px">La cuota se calcula sola. No cambies el orden de los nombres si ya hay pagos.</div></div>
<div class="card"><h2>Respaldo</h2><textarea id="bk" rows="4">${E(JSON.stringify(S))}</textarea><button class="btn" onclick="imp()">Restaurar desde este texto</button><div class="mu" style="margin-top:8px">Copia ese texto y guárdalo en Notas.</div></div>
<div class="card"><button class="btn" onclick="upd()">Actualizar app (versión 5)</button></div>`}
document.getElementById('v').innerHTML=h}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
