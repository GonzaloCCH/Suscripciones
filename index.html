<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#2457D6">
<title>Cuentas ChatGPT</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF2F7;--card:#fff;--ink:#14202E;--mut:#5C6B7D;--line:#D9E1EA;--acc:#2457D6;--accbg:#DCE6FA;--ok:#15803D;--rd:#DC2626;--or:#EA580C;--gb:#BBF0CD;--rb:#FAD0D0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1420;--card:#152031;--ink:#E7EEF7;--mut:#8EA0B5;--line:#263649;--acc:#7FA6FF;--accbg:#1C2E52;--ok:#4ADE80;--rd:#F87171;--or:#FB923C;--gb:#14532D;--rb:#5B1F1F}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,system-ui,-apple-system,sans-serif;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
header button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0 6px;font-size:10px;font-weight:600;line-height:1.2}
header button.on{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}header button span{display:block;font-size:18px}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:0 0 8px;font-weight:600;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;margin:2px 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:var(--card);font-weight:600}
button.g{background:transparent;color:var(--mut);padding:6px 8px;font-size:14px}.btn{width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.tgb{font-size:13px;font-weight:600;color:var(--acc);background:var(--accbg);padding:5px 10px;border-radius:20px}
.tag{font-size:13px;color:var(--mut)}.lb{font-size:12px;color:var(--mut)}
.item{padding:9px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.ok{color:var(--ok)}.rd{color:var(--rd)}.or{color:var(--or)}.amt{font-weight:700;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--rb);margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border-radius:10px;padding:7px 2px;text-align:center;font-size:12px;line-height:1.3}.m b{display:block}.m span{display:block;min-height:15px;font-weight:600}
.big{font-size:24px;font-weight:700}.x{background:none;color:var(--rd);padding:0 6px;font-size:20px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;font-size:14px}#toast.on{opacity:1}
</style></head><body>
<header id="n"></header><main id="v"></main><div id="toast"></div>
<script>
const K='cuentasChatGPT';
let S={members:['Yo','Hermano 1','Hermano 2','Hermano 3'],accounts:['BANRURAL','ZIGI','Efectivo'],cost:61.29,start:'2026-11',pay:[],out:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cur=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
let V={tab:'ini',mes:cur(),ed:'',sel:0,o:{cu:false,ad:true}};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>(Math.round(n*100)/100).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const f4=n=>(Math.round(n*10000)/10000).toLocaleString('es',{maximumFractionDigits:4});
const today=()=>new Date().toISOString().slice(0,10);
const msg=t=>{const e=document.getElementById('toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2200)};
const share=()=>S.cost/S.members.length;
const paid=i=>S.pay.filter(p=>p.m==i).reduce((a,p)=>a+p.a,0);
const outSh=()=>S.out.reduce((a,o)=>a+o.a,0)/S.members.length;
const saldo=i=>paid(i)-outSh();
const meses=i=>Math.max(0,Math.floor(saldo(i)/share()+1e-9));
const sp=()=>S.start.split('-').map(Number);
const kraw=mo=>{const[y,m]=mo.split('-').map(Number),[a,b]=sp();return (y-a)*12+m-b};
const midx=mo=>Math.max(0,kraw(mo||S.start));
const ym=k=>{const[y,m]=sp();const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mlab=k=>{const[y,m]=sp();return new Date(y,m-1+k,1).toLocaleDateString('es',{month:'short',year:'2-digit'})};
const mlong=mo=>{const[y,m]=mo.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es',{month:'long',year:'numeric'})};
const cov=i=>{const sh=share(),c=[];S.pay.filter(p=>p.m==i).sort((a,b)=>midx(a.mo)-midx(b.mo)||a.id-b.id).forEach(p=>{let k=midx(p.mo),r=p.a;while(r>1e-9){const need=sh-(c[k]||0);if(need<=1e-6){k++;continue}const put=Math.min(r,need);c[k]=(c[k]||0)+put;r-=put;k++}});return c};
const full=(c,k)=>(c[k]||0)>=share()-1e-6;
const upto=i=>{const c=cov(i);let l=-1;for(let k=0;k<c.length;k++)if(full(c,k))l=k;return l>=0?mlab(l):'—'};
const firstUn=i=>{const c=cov(i);let k=0;while(full(c,k))k++;return k};
const cell=(c,k)=>{const v=c[k]||0,sh=share(),p=Math.min(100,v/sh*100),fl=p>=99.99;const bg=fl?'var(--gb)':p<=0?'var(--rb)':`linear-gradient(90deg,var(--gb) ${p}%,var(--rb) ${p}%)`;return `<div class="m" style="background:${bg}"><b>${mlab(k)}</b><span>${fl?'✓':v>0?f2(v):''}</span></div>`};
const grid=i=>{const c=cov(i),n=Math.max(12,c.length+1);let h='<div class="gr">';for(let k=0;k<n;k++)h+=cell(c,k);return h+'</div>'};
const optI=(l,s)=>l.map((x,i)=>`<option value="${i}" ${i==s?'selected':''}>${E(x)}</option>`).join('');
const optN=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${E(x)}</option>`).join('');
const METH=['Efectivo','Transferencia','Depósito','Otro'];
const tg=k=>{V.o[k]=!V.o[k];draw()};
const hd=(k,t,s)=>`<div class="hd" onclick="tg('${k}')"><div><b>${t}</b><div class="tag">${s}</div></div><span class="tgb">${V.o[k]?'Ocultar ▾':'Ver ▸'}</span></div>`;
const ted=k=>{V.ed=V.ed===k?'':k;draw()};
function up(L,id,p,v,t){const x=S[L].find(y=>y.id==id);if(!x)return;if(t=='n'){v=parseFloat(v);if(!(v>0)){draw();return}}else if(t=='i')v=+v;else if(!v&&t!='x'){draw();return}x[p]=v;save();draw()}
function rm(L,id){if(!confirm('¿Eliminar?'))return;S[L]=S[L].filter(y=>y.id!=id);V.ed='';save();draw()}
const fld=(L,x,p,lb,t,inner)=>{const c=`onchange="up('${L}','${x.id}','${p}',this.value,'${t}')"`;return `<span class="lb">${lb}</span>`+(inner?`<select ${c}>${inner}</select>`:`<input type="${t=='n'?'number" inputmode="decimal" step="any':t=='d'?'date':t=='mo'?'month':'text'}" value="${E(x[p])}" ${c}>`)};
const payForm=x=>fld('pay',x,'m','Persona','i',optI(S.members,x.m))+fld('pay',x,'a','Monto','n')+fld('pay',x,'d','Fecha','d')+fld('pay',x,'mo','Mes que paga','mo')+fld('pay',x,'t','Forma de pago','t',optN(METH,x.t))+fld('pay',x,'c','Dónde lo tengo','t',optN(S.accounts,x.c))+fld('pay',x,'n','Nota','x')+`<button class="g" onclick="rm('pay','${x.id}')">Eliminar pago</button>`;
const prow=p=>`<div class="item"><div class="row" onclick="ted('p${p.id}')" style="cursor:pointer"><div><b>${E(S.members[p.m]||'?')}</b><div class="tag">${p.d} · mes: ${p.mo||S.start} · ${E(p.t)} · ${E(p.c)}${p.n?' · '+E(p.n):''}</div></div><span class="amt">${f2(p.a)}</span><button class="x" onclick="event.stopPropagation();rm('pay','${p.id}')">×</button></div>${V.ed=='p'+p.id?payForm(p):''}</div>`;
const plist=l=>l.length?l.map(prow).join(''):'<div class="tag">Sin pagos.</div>';
function addP(){const a=parseFloat(document.getElementById('a').value);if(!(a>0))return msg('Escribe un monto');
S.pay.unshift({id:Date.now()+'',m:+document.getElementById('m').value,d:document.getElementById('d').value||today(),mo:document.getElementById('mo').value||S.start,a,t:document.getElementById('t2').value,c:document.getElementById('c').value,n:document.getElementById('n2').value});save();msg('Pago guardado');draw()}
function addO(){const a=parseFloat(document.getElementById('oa').value);if(!(a>0))return msg('Escribe un monto');
S.out.unshift({id:Date.now()+'',mo:document.getElementById('om').value||cur(),a,c:document.getElementById('oc').value});save();msg('Salida guardada');draw()}
function setCfg(){S.cost=parseFloat(document.getElementById('cost').value)||S.cost;S.start=document.getElementById('st').value||S.start;
S.members=document.getElementById('mem').value.split('\n').map(x=>x.trim()).filter(Boolean);S.accounts=document.getElementById('acc').value.split('\n').map(x=>x.trim()).filter(Boolean);save();msg('Guardado');draw()}
async function upd(){try{const r=await navigator.serviceWorker.getRegistrations();for(const x of r)await x.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function imp(){try{S=JSON.parse(document.getElementById('bk').value);save();draw()}catch(e){alert('Datos no válidos')}}
function draw(){
const T=[['ini','🏠','Inicio'],['pag','💰','Pagos'],['per','👤','Persona'],['out','💸','Salidas'],['cfg','⚙️','Ajustes']];
document.getElementById('n').innerHTML=T.map(([k,i,l])=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';V.ed='';draw();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('');
const sh=share(),n=S.members.length;let h='';
if(V.tab=='ini'){const k=kraw(V.mes);let col=0;
const rows=S.members.map((nm,i)=>{const c=cov(i),v=k>=0?(c[k]||0):0;col+=v;const p=Math.min(100,v/sh*100),fl=p>=99.99;const cl=fl?'ok':v>0?'or':'rd',st=fl?'Pagado':v>0?'Parcial':'Sin pagar';
return `<div class="item"><div class="row"><b>${E(nm)}</b><span class="amt ${cl}">${st}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="tag">Cubierto ${f2(v)} de ${f4(sh)}${fl?'':' · falta '+f2(sh-v)}</div><div class="tag">Saldo total <b>${f2(saldo(i))}</b> · ${meses(i)} meses · hasta ${upto(i)}</div></div>`}).join('');
h+=`<div class="card"><input type="month" value="${V.mes}" onchange="V.mes=this.value||V.mes;draw()"><div class="row"><div><div class="tag">Cuota por persona (${f2(S.cost)} ÷ ${n})</div><div class="big">${f4(sh)}</div></div><div style="text-align:right"><div class="tag">Recaudado en ${mlong(V.mes)}</div><b>${f2(col)} / ${f2(S.cost)}</b></div></div></div>
<div class="card"><h2>${mlong(V.mes)}</h2>${k<0?'<div class="tag">Es anterior al primer mes a cobrar.</div>':''}${rows}</div>
<div class="card">${hd('cu','Dónde está el dinero','Por cuenta')}${V.o.cu?S.accounts.map(a=>{const v=S.pay.filter(p=>p.c==a).reduce((s,p)=>s+p.a,0)-S.out.filter(o=>o.c==a).reduce((s,o)=>s+o.a,0);return `<div class="kv"><span>${E(a)}</span><b>${f2(v)}</b></div>`}).join(''):''}</div>`}
if(V.tab=='pag'){h+=`<div class="card">${hd('ad','Registrar pago','Quién, monto y mes')}${V.o.ad?`<span class="lb">Quién pagó</span><select id="m" onchange="document.getElementById('mo').value=ym(firstUn(+this.value))">${optI(S.members,0)}</select>
<span class="lb">Mes que empieza a pagar</span><input id="mo" type="month" value="${ym(firstUn(0))}">
<span class="lb">Monto</span><input id="a" type="number" inputmode="decimal" step="any" placeholder="25, 60…">
<span class="lb">Fecha</span><input id="d" type="date" value="${today()}">
<span class="lb">Forma de pago</span><select id="t2">${optN(METH)}</select>
<span class="lb">Dónde lo tengo</span><select id="c">${optN(S.accounts)}</select>
<span class="lb">Nota (opcional)</span><input id="n2"><button class="btn" onclick="addP()">Guardar pago</button>`:''}</div>
<div class="card"><h2>Todos los pagos · toca uno para editarlo</h2>${plist(S.pay)}</div>`}
if(V.tab=='per'){const i=Math.min(V.sel,n-1);h+=`<div class="card"><select onchange="V.sel=+this.value;draw()">${optI(S.members,i)}</select>
<div class="kv"><span>Pagado</span><b>${f2(paid(i))}</b></div><div class="kv"><span>Saldo actual</span><b>${f2(saldo(i))}</b></div><div class="kv"><span>Meses que le quedan</span><b>${meses(i)}</b></div><div class="kv"><span>Cubierto hasta</span><b>${upto(i)}</b></div></div>
<div class="card"><h2>Meses · verde pagado, rojo pendiente</h2>${grid(i)}</div>
<div class="card"><h2>Pagos de ${E(S.members[i]||'')}</h2>${plist(S.pay.filter(p=>p.m==i))}</div>`}
if(V.tab=='out'){h+=`<div class="card"><h2>Pago de la suscripción</h2><span class="lb">Mes</span><input id="om" type="month" value="${cur()}">
<span class="lb">Monto pagado a ChatGPT</span><input id="oa" type="number" inputmode="decimal" step="any" value="${S.cost}">
<span class="lb">De dónde salió</span><select id="oc">${optN(S.accounts)}</select>
<button class="btn" onclick="addO()">Guardar y descontar a todos</button><div class="tag" style="margin-top:8px">Se descuenta monto ÷ ${n} del saldo de cada uno.</div></div>
<div class="card"><h2>Salidas · toca para editar</h2>${S.out.length?S.out.map(o=>`<div class="item"><div class="row" onclick="ted('o${o.id}')" style="cursor:pointer"><div><b>${mlong(o.mo)}</b><div class="tag">${E(o.c)} · c/u ${f4(o.a/n)}</div></div><span class="amt rd">${f2(o.a)}</span><button class="x" onclick="event.stopPropagation();rm('out','${o.id}')">×</button></div>${V.ed=='o'+o.id?fld('out',o,'mo','Mes','mo')+fld('out',o,'a','Monto','n')+fld('out',o,'c','Cuenta','t',optN(S.accounts,o.c)):''}</div>`).join(''):'<div class="tag">Sin salidas.</div>'}</div>`}
if(V.tab=='cfg'){h+=`<div class="card"><span class="lb">Costo mensual de la suscripción</span><input id="cost" type="number" step="any" value="${S.cost}">
<span class="lb">Primer mes a cobrar</span><input id="st" type="month" value="${S.start}">
<span class="lb">Personas (una por línea)</span><textarea id="mem" rows="5">${S.members.map(E).join('\n')}</textarea>
<span class="lb">Cuentas (una por línea)</span><textarea id="acc" rows="4">${S.accounts.map(E).join('\n')}</textarea>
<button class="btn" onclick="setCfg()">Guardar ajustes</button><div class="tag" style="margin-top:8px">La cuota se calcula sola. No cambies el orden de los nombres si ya hay pagos.</div></div>
<div class="card"><h2>Respaldo</h2><textarea id="bk" rows="4">${E(JSON.stringify(S))}</textarea><button class="btn" onclick="imp()">Restaurar desde este texto</button></div>
<div class="card"><h2>Versión 4</h2><button class="btn" onclick="upd()">Actualizar app</button><div class="tag" style="margin-top:8px">Si ves el menú abajo o no ves los cambios, toca este botón.<div class="tag" style="margin-top:8px">Copia ese texto y guárdalo en Notas.</div></div>`}
document.getElementById('v').innerHTML=h}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
